<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#0f5132;color:#fff;}
.container{max-width:900px;margin:auto;padding:15px;}

.header{text-align:center;margin-bottom:15px;}
.header h1{font-size:22px;}

.timer{
  background:#6a0dad;
  padding:12px;
  border-radius:15px;
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 8px 0 #4b0082,0 15px 25px rgba(0,0,0,0.4);
}

/* AD BOX */
.ad-slot{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:15px 0;
  min-height:60px;
}

.big-card img{width:100%;border-radius:15px;}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}

.profile-card{
  background:#1e1b6b;
  border-radius:20px;
  padding:10px;
  text-decoration:none;
  color:#fff;
  box-shadow:0 0 0 3px #00ff2a,0 10px 25px rgba(0,0,0,0.4);
}

.profile-img{position:relative;}
.profile-img img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:15px;
}

.online-badge{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(255,255,255,0.85);
  color:#000;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:5px;
}

.online-dot{
  width:8px;height:8px;
  background:#00ff2a;
  border-radius:50%;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.4);}
  100%{transform:scale(1);}
}

.profile-info{
  background:#1faa2b;
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  text-align:center;
}

.call-btn{
  background:#d1e7dd;
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  color:#000;
}

.info{
  margin-top:20px;
  background:#ffffff;
  color:#000;
  padding:18px;
  border-radius:25px;
}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
</style>

<body>

<!-- ⏱ TIMER -->
<script>
let time = 4*60*60;
setInterval(()=>{
let h=Math.floor(time/3600);
let m=Math.floor((time%3600)/60);
let s=time%60;
document.getElementById("countdown").innerText=
String(h).padStart(2,'0')+":"+
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0');
if(time>0) time--;
},1000);
</script>
